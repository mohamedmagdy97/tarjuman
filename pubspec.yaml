name: tarjuman
description: "A new Flutter project."
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: ^3.11.5

dependencies:
  drift: 2.31.0
  drift_flutter: 0.2.7
  equatable: ^3.0.0
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  google_mlkit_translation: ^0.14.0
  http: ^1.6.0
  intl: ^0.20.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^1.2.5
  meta: ^1.17.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  screen_brightness: ^2.1.11
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.7.0
  whisper_cpp_flutter_plus: ^0.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: 2.31.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0D14"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
